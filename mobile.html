<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TOP DOWN — telefon</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0e12; overflow: hidden; }
      /* 100dvh: na telefonie wysokość bez paska adresu (100% potrafi sięgać pod pasek i ucinać górę gry). */
      body { height: 100dvh; }
      /* Płótno centruje strona, nie Phaser — po obrocie telefonu i pełnym ekranie środek zawsze się zgadza. */
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #game canvas { flex: none; margin: 0 !important; }
      /* Dotyk: bez przewijania, powiększania i zaznaczania tekstu gestami. */
      html, body, #game { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #rotate { display: none; }
      @media (orientation: portrait) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
          background: #0e0e12; color: #f1e2a9; font: 18px monospace; text-align: center; padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Obróć telefon poziomo ↻</div>
    <script type="module" src="/src/mobile/main.mobile.ts"></script>
  </body>
</html>
